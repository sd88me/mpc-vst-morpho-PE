<svg xmlns="http://www.w3.org/2000/svg" width="360" height="100" viewBox="0 0 360 100">
  <!-- Morpho-PE wordmark, our own lettering (rounded lowercase on a bouncing baseline, outlined, with a small PE above) and an
       abstract butterfly as the first o; drawn in the spirit of the instrument's era, not its logo -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#e8eeff"/><stop offset="1" stop-color="#a9bfff"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/><stop offset="0.5" stop-color="#3f86ff"/><stop offset="1" stop-color="#1630c8"/>
    </linearGradient>
    <g id="letters" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- m -->
      <path d="M24,72 V48 A12,12 0 0 1 48,48 V72 M48,48 A12,12 0 0 1 72,48 V72" transform="translate(0,-2) rotate(-3 48 56)"/>
      <!-- r -->
      <path d="M134,73 V40 M134,52 C134,42 142,37 154,38" transform="translate(0,1)"/>
      <!-- p -->
      <path d="M170,40 V90 M170,56 A16,16 0 1 0 202,56 A16,16 0 1 0 170,56" transform="translate(0,-3) rotate(4 186 56)"/>
      <!-- h -->
      <path d="M220,72 V16 M220,52 A13,13 0 0 1 246,52 V72" transform="translate(0,1)"/>
      <!-- o -->
      <circle cx="276" cy="56" r="16" transform="translate(0,-2)"/>
    </g>
  </defs>
  <!-- PE, small and bold above the m, as the instrument puts POLY over its name -->
  <text x="18" y="27" font-family="Titillium Web, sans-serif" font-weight="900" font-style="italic" font-size="21" fill="#f5b400"
        stroke="#0b1240" stroke-width="5" paint-order="stroke" letter-spacing="1">PE</text>
  <use href="#letters" stroke="#0b1240" stroke-width="21"/>
  <use href="#letters" stroke="url(#ink)" stroke-width="12"/>
  <!-- the first o: an abstract butterfly, four wing loops round an empty body -->
  <g transform="translate(102,54) rotate(-6)">
    <g stroke="#0b1240" stroke-width="9" fill="none">
      <ellipse cx="-9" cy="-6" rx="10.5" ry="13.5" transform="rotate(-28 -9 -6)"/>
      <ellipse cx="9" cy="-6" rx="10.5" ry="13.5" transform="rotate(28 9 -6)"/>
      <ellipse cx="-7" cy="11" rx="6" ry="8" transform="rotate(30 -7 11)"/>
      <ellipse cx="7" cy="11" rx="6" ry="8" transform="rotate(-30 7 11)"/>
    </g>
    <g stroke="#ffffff" stroke-width="2.4" fill="url(#wing)">
      <ellipse cx="-9" cy="-6" rx="10.5" ry="13.5" transform="rotate(-28 -9 -6)"/>
      <ellipse cx="9" cy="-6" rx="10.5" ry="13.5" transform="rotate(28 9 -6)"/>
      <ellipse cx="-7" cy="11" rx="6" ry="8" transform="rotate(30 -7 11)"/>
      <ellipse cx="7" cy="11" rx="6" ry="8" transform="rotate(-30 7 11)"/>
    </g>
  </g>
</svg>
