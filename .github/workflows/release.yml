# Builds morpho-pe for Gen1 (armv7) and Gen2 (aarch64), packages the zips with mpc-vst-plugins' release.py and attaches them to a DRAFT
# release. A person installs that exact zip on a device and publishes the draft (mpc-vst-plugins docs/RELEASING.md).
# Move the pin (both places) to the current main of open-mpc/mpc-vst-plugins before each release.
name: Release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.1
        required: true
      dry_run:
        description: Zip as a run artifact only, no draft release
        type: boolean
        default: true

jobs:
  release:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@1777e405a4c15c380f7a1b1adf673dd73c1a0585
    permissions: { contents: write }
    with:
      tag: morpho-pe-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 1777e405a4c15c380f7a1b1adf673dd73c1a0585
      vst_dir: vst
      build: '"$MPC_VST/tools/build_port.sh" vst/vst.json'
      host_test: '"$MPC_VST/tools/test_port.sh" vst/vst.json'
      plugin_id: morpho-pe
      license: GPL-3.0-or-later
      about: "Four-voice synthesizer modelled on the Poly Evolver's voice, with a 4 x 16 step sequencer, a bank browser and a touchscreen skin."
      dry_run: ${{ inputs.dry_run }}
